databases:
  - name: ruleradar-postgres
    plan: basic-1gb

services:
  - type: web
    name: ruleradar-web
    runtime: docker
    plan: starter
    branch: codex/ruleradar-demo
    rootDir: ruleradar-sweden
    dockerContext: ruleradar-sweden
    dockerfilePath: ruleradar-sweden/infra/docker/Dockerfile.web
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://ruleradar-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ruleradar-postgres
          property: connectionString
      - key: SYSTEM_CRON_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5
      - key: ALERT_FROM_EMAIL
        value: RuleRadar Sweden <alerts@example.com>
    healthCheckPath: /api/health
    preDeployCommand: npm run db:migrate
    initialDeployHook: npm run db:seed
    autoDeployTrigger: off

  - type: worker
    name: ruleradar-worker
    runtime: docker
    plan: starter
    branch: codex/ruleradar-demo
    rootDir: ruleradar-sweden
    dockerContext: ruleradar-sweden
    dockerfilePath: ruleradar-sweden/infra/docker/Dockerfile.worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://ruleradar-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ruleradar-postgres
          property: connectionString
      - key: OPENAI_MODEL
        value: gpt-5
      - key: ALERT_FROM_EMAIL
        value: RuleRadar Sweden <alerts@example.com>
    autoDeployTrigger: off

  - type: cron
    name: ruleradar-scan-cron
    runtime: docker
    plan: starter
    branch: codex/ruleradar-demo
    rootDir: ruleradar-sweden
    dockerContext: ruleradar-sweden
    dockerfilePath: ruleradar-sweden/infra/docker/Dockerfile.worker
    schedule: "*/30 * * * *"
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://ruleradar-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ruleradar-postgres
          property: connectionString
      - key: OPENAI_MODEL
        value: gpt-5
      - key: ALERT_FROM_EMAIL
        value: RuleRadar Sweden <alerts@example.com>
    dockerCommand: npm run scan:run
    autoDeployTrigger: off
