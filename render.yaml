services:
  - type: web
    name: ruleradar-web
    runtime: docker
    plan: free
    branch: codex/ruleradar-demo
    rootDir: ruleradar-sweden
    dockerfilePath: ./infra/docker/Dockerfile.web
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://ruleradar-web.onrender.com
      - key: OPENAI_MODEL
        value: gpt-5
      - key: ALERT_FROM_EMAIL
        value: RuleRadar Sweden <alerts@example.com>
    healthCheckPath: /api/health
    autoDeployTrigger: off
