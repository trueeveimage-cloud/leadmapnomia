databases:
  - name: ruleradar-postgres
    plan: basic-1gb

envVarGroups:
  - name: ruleradar-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ruleradar-postgres
          property: connectionString
      - key: SYSTEM_CRON_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SOLO_PRICE_ID
        sync: false
      - key: STRIPE_TEAM_PRICE_ID
        sync: false
      - key: STRIPE_MULTI_OFFICE_PRICE_ID
        sync: false

services:
  - type: web
    name: ruleradar-web
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/docker/Dockerfile.web
    envVarGroups:
      - ruleradar-shared
    healthCheckPath: /api/health
    preDeployCommand: npm run db:migrate

  - type: worker
    name: ruleradar-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/docker/Dockerfile.worker
    envVarGroups:
      - ruleradar-shared

  - type: cron
    name: ruleradar-scan-cron
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/docker/Dockerfile.worker
    schedule: "*/30 * * * *"
    envVarGroups:
      - ruleradar-shared
    dockerCommand: npm run scan:run
