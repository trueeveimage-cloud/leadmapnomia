name: RuleRadar CI

on:
  pull_request:
    paths:
      - "ruleradar-sweden/**"
  push:
    branches: [main]
    paths:
      - "ruleradar-sweden/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruleradar-sweden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ruleradar-sweden/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
